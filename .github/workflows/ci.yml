name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: Typecheck example apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The example apps need the whole workspace (rspeedy, ReactLynx, vue-lynx).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The examples import the workspace package by name, which resolves to
      # dist/*.d.ts — without this they fail on TS2307.
      - name: Build package
        run: pnpm run build

      # tsc for ReactLynx, vue-tsc for the Vue SFC — both against @lynx-js/types.
      - name: Typecheck
        run: pnpm run typecheck:examples

  build:
    name: Build package
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Only the library subtree; the example/ Lynx apps are not built in CI.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @vyui/chimera-camera

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # Guards the regression that shipped an 11.7MB / 103-file tarball:
      # stale example build output and node_modules symlinks. Healthy: 78 files / 0.43MB.
      # images/ ships so the npm page renders standalone rather than relying on
      # npm rewriting relative paths to GitHub; images/src/ must not.
      #
      # Measures the extracted tarball rather than `pnpm pack --json`, which reports
      # only paths — no entryCount, unpackedSize, or per-file size. Reading those off
      # its output yields undefined, and `undefined > 90` is false, so both size
      # guards would pass unconditionally. Extracting also avoids parsing `tar -tzvf`,
      # whose column layout differs between the BSD tar here and GNU tar.
      - name: Validate package contents
        run: |
          pnpm pack --out /tmp/pkg.tgz
          mkdir -p /tmp/packcheck && tar xzf /tmp/pkg.tgz -C /tmp/packcheck
          node -e "
            const fs = require('fs'), path = require('path');
            const fail = (m) => { console.error('pack regression: ' + m); process.exit(1); };
            const root = '/tmp/packcheck/package';
            const files = [];
            (function walk(dir) {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name);
                e.isDirectory() ? walk(p) : files.push({ path: path.relative(root, p), size: fs.statSync(p).size });
              }
            })(root);
            const unpackedSize = files.reduce((n, f) => n + f.size, 0);
            const leaked = files.map((f) => f.path).filter((f) => /node_modules|^example\/.*dist\/|^docs\/archive\/|^images\/src\//.test(f));
            if (leaked.length) fail('leaked paths: ' + leaked.join(', '));
            if (files.length > 90) fail(files.length + ' files, max 90');
            if (unpackedSize > 600000) fail(unpackedSize + ' bytes unpacked, max 600000');
            console.log('ok: ' + files.length + ' files, ' + unpackedSize + ' unpacked, ' + fs.statSync('/tmp/pkg.tgz').size + ' packed');
          "
