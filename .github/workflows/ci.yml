name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: Typecheck example apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The example apps need the whole workspace (rspeedy, ReactLynx, vue-lynx).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc for ReactLynx, vue-tsc for the Vue SFC — both against @lynx-js/types.
      - name: Typecheck
        run: pnpm run typecheck:examples

  build:
    name: Build package
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Only the library subtree; the example/ Lynx apps are not built in CI.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @vyui/chimera-camera

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # Guards the regression that shipped an 11.7MB / 103-file tarball:
      # stale example build output and node_modules symlinks. Healthy: 76 files / 0.43MB.
      # images/ ships so the npm page renders standalone rather than relying on
      # npm rewriting relative paths to GitHub; images/src/ must not.
      - name: Validate package contents
        run: |
          npm pack --dry-run --json | node -e "
            const p = JSON.parse(require('fs').readFileSync(0, 'utf8'))[0];
            const fail = (m) => { console.error('pack regression: ' + m); process.exit(1); };
            const leaked = p.files.map((f) => f.path).filter((f) => /node_modules|^example\/.*dist\/|^docs\/archive\/|^images\/src\//.test(f));
            if (leaked.length) fail('leaked paths: ' + leaked.join(', '));
            if (p.entryCount > 90) fail(p.entryCount + ' files, max 90');
            if (p.unpackedSize > 600000) fail(p.unpackedSize + ' bytes unpacked, max 600000');
            console.log('ok: ' + p.entryCount + ' files, ' + p.unpackedSize + ' unpacked, ' + p.size + ' packed');
          "
