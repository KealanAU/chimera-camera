name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - beta
          - alpha

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: macos-latest
    # Gated: the run waits for manual approval before the publish step.
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @vyui/camera

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # Authenticates via OIDC trusted publishing — no NPM_TOKEN secret. pnpm
      # exchanges the id-token above for a short-lived registry credential, so
      # there is no long-lived token to leak. Requires the trusted publisher to
      # be configured on npmjs.com against THIS repo and workflow filename.
      #
      # setup-node's registry-url writes `_authToken=${NODE_AUTH_TOKEN}` into
      # .npmrc, and NODE_AUTH_TOKEN is deliberately unset here. pnpm 11.1.3+
      # treats an unresolved ${VAR} placeholder as empty instead of sending it
      # verbatim as a bearer token, which is what made this 404 before
      # (pnpm/pnpm#11513) — so this needs pnpm >= 11.1.3, not just >= 11.
      - name: Publish
        run: pnpm publish --access public --tag "${{ inputs.tag }}" --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"
