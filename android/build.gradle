// Reference build config for the Chimera Camera Android sources. UNVERIFIED.
//
// With no autolinking (deferred — see ROADMAP.md), a Lynx Android host integrates
// these sources manually: either add this directory as a Gradle module, or point
// a source set at android/src/main and add the dependencies below to the host.
// Pin the Lynx dependency to the version the host app uses.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kealanau.chimeracamera'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def cameraxVersion = '1.3.4'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation "androidx.camera:camera-video:$cameraxVersion"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-common:2.8.4'

    // Provided by the host app; match its Lynx release.
    compileOnly 'org.lynxsdk.lynx:lynx:3.9.0'
}
