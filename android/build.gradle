// Build config for the Chimera Camera Android library.
//
// This directory is a consumable Gradle module: a host app includes it from
// node_modules (see ../docs/android-install.md) rather than copying sources.
// Lynx is compileOnly so the module links against whatever version the host
// ships. Lynx has no autolinking (see ROADMAP.md), so the host still registers
// the module and the camera-view behavior itself.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vyui.chimeracamera'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def cameraxVersion = '1.3.4'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation "androidx.camera:camera-video:$cameraxVersion"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-common:2.8.4'

    // Provided by the host app; match its Lynx release.
    compileOnly 'org.lynxsdk.lynx:lynx:3.9.0'
}
